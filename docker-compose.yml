services:
  # 1. Message Broker
  redis:
    image: redis:7-alpine
    container_name: ims-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Data Lake
  mongodb:
    image: mongo:6
    container_name: ims-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongo --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Source of Truth
  postgres:
    image: postgres:15-alpine
    container_name: ims-postgres
    env_file: .env
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-ims_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

# Declare the named volumes so Docker knows to persist them
volumes:
  redis_data:
  mongo_data:
  postgres_data:
